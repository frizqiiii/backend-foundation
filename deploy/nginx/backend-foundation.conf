# Nginx reverse proxy untuk backend-foundation.
#
# Cara pakai:
#   1. Ganti SEMUA "api.example.com" di file ini dengan domain Anda.
#   2. Salin ke /etc/nginx/sites-available/backend-foundation.conf
#   3. sudo ln -s /etc/nginx/sites-available/backend-foundation.conf \
#        /etc/nginx/sites-enabled/
#   4. Jalankan Certbot (lihat deploy/README.md) — Certbot akan
#      OTOMATIS menyisipkan baris `ssl_certificate`/`ssl_certificate_key`
#      yang benar ke server block HTTPS di bawah, mengonversi block
#      port 80 jadi redirect ke HTTPS.
#   5. sudo nginx -t && sudo systemctl reload nginx

# Rate limiting di level Nginx — LAPISAN TAMBAHAN di depan
# `express-rate-limit` yang sudah ada di aplikasi (defense in depth).
# Nginx menolak request berlebih SEBELUM sempat membebani proses
# Node.js sama sekali, sementara express-rate-limit di aplikasi tetap
# jadi penjaga utama untuk logika bisnis (limit khusus /auth, dst).
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

# Redirect HTTP -> HTTPS. Certbot akan mengisi ini otomatis saat
# dijalankan pertama kali; ditulis manual di sini sebagai referensi.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sintaks "listen ... http2" (bukan `http2 on;` terpisah) sengaja
    # dipakai untuk kompatibilitas lebih luas — bekerja di Nginx 1.18
    # s.d. versi terbaru. Kalau Nginx Anda 1.25.1+, boleh diganti ke
    # `http2 on;` di baris terpisah (sintaks baru yang direkomendasikan).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Diisi Certbot secara otomatis (certbot --nginx) — path standar
    # Let's Encrypt, jangan diubah manual kecuali tahu persis akibatnya.
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security header di level Nginx — TIDAK menduplikasi apa yang
    # sudah dipasang Helmet di aplikasi (X-Frame-Options, dst — itu
    # tetap tanggung jawab aplikasi), hanya menambah yang murni
    # tanggung jawab web server/transport.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 6M; # sedikit di atas batas upload 5MB aplikasi

    location /health {
        # Health check TIDAK kena rate limit — load balancer/orchestrator
        # perlu bisa memanggilnya sesering apa pun tanpa risiko ditolak.
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeout sedikit lebih longgar dari default Nginx — upload
        # file (endpoint /api/v1/upload) butuh waktu lebih dari
        # request API biasa.
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
