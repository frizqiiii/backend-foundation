# Phase 20 (Enterprise DevOps) — TEMPLATE Secret, BUKAN Secret yang
# siap dipakai. SELURUH value di bawah ini adalah PLACEHOLDER —
# JANGAN `kubectl apply` file ini apa adanya ke cluster manapun, dan
# JANGAN PERNAH commit versi file ini yang sudah diisi value asli ke
# Git (Secret Kubernetes HANYA base64-encoded, BUKAN terenkripsi —
# siapa pun dengan akses `kubectl get secret -o yaml` bisa membaca
# isinya mentah-mentah).
#
# Untuk PRODUCTION SUNGGUHAN, pakai salah satu dari:
# - External Secrets Operator (sinkron dari AWS Secrets Manager/
#   HashiCorp Vault/GCP Secret Manager ke Secret Kubernetes otomatis)
# - Sealed Secrets (Bitnami) — Secret terenkripsi yang AMAN di-commit
#   ke Git, hanya bisa didekripsi oleh controller di cluster tujuan
# - SOPS + kustomize/helm-secrets
#
# File ini murni dokumentasi "field APA SAJA yang dibutuhkan
# aplikasi" (persis field yang divalidasi wajib di `env.ts`) — isi
# `stringData` di bawah sebelum apply, atau lebih baik lagi, generate
# lewat `kubectl create secret generic ... --from-literal=...` supaya
# value asli TIDAK PERNAH tersimpan sebagai file di disk sama sekali.
apiVersion: v1
kind: Secret
metadata:
  name: backend-foundation-secret
  labels:
    app.kubernetes.io/name: backend-foundation
    app.kubernetes.io/part-of: backend-foundation
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGE_ME:CHANGE_ME@postgres:5432/app_db?schema=public"
  DATABASE_REPLICA_URL: ""
  REDIS_URL: "redis://:CHANGE_ME@redis:6379"
  REDIS_CLUSTER_NODES: ""

  # WAJIB minimal 32 karakter acak — lihat validasi panjang di
  # `env.ts`. `JWT_SECRET_PREVIOUS` diisi HANYA saat sedang rotasi
  # secret (Phase 5) — kosongkan lagi setelah rotasi selesai.
  JWT_SECRET: "CHANGE_ME_MIN_32_CHARS_RANDOM_SECRET"
  JWT_SECRET_PREVIOUS: ""

  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_KEY_BASE64_ENCODED"
  ENCRYPTION_KEY_PREVIOUS: ""

  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"

  RESEND_API_KEY: "CHANGE_ME"
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  FCM_SERVER_KEY: "CHANGE_ME"
  STRIPE_SECRET_KEY: "CHANGE_ME"
  MEILISEARCH_API_KEY: "CHANGE_ME"

  GITHUB_CLIENT_SECRET: "CHANGE_ME"

  SENTRY_DSN: ""
  ALERTMANAGER_WEBHOOK_SECRET: "CHANGE_ME"

  # Kredensial Basic Auth Bull Board (Phase 19) — username-nya di
  # ConfigMap (bukan rahasia), password-nya di sini.
  QUEUE_DASHBOARD_PASSWORD: "CHANGE_ME"
