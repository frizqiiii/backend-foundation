# Phase 20 (Enterprise DevOps) — Deployment proses API
# (`node dist/server.js`). Topologi SENGAJA mengikuti
# `docker-compose.prod.yml` yang SUDAH ADA: proses API dan proses
# worker (`worker-deployment.yaml`) adalah DUA Deployment terpisah,
# BUKAN satu Deployment dengan dua container — supaya bisa di-scale
# independen (mis. 3 replica API + 1 replica worker) dan crash di
# worker tidak pernah ikut menjatuhkan API.
#
# Label `track: stable` — INILAH yang membuat pola Blue-Green
# (lihat `k8s/README.md`) mungkin dilakukan: `service.yaml` memilih
# Pod lewat `track: stable`, BUKAN nama Deployment. Saat blue-green
# cutover, Deployment BARU di-apply dengan `track: green` (Service
# TIDAK ikut memilihnya dulu — traffic tetap 100% ke `stable`),
# divalidasi manual/otomatis, BARU `service.yaml` diedit
# `track: green` untuk switch traffic sepenuhnya dalam SATU langkah
# atomik (bukan bertahap seperti rolling update biasa).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-foundation-api
  labels:
    app.kubernetes.io/name: backend-foundation
    app.kubernetes.io/component: api
    track: stable
spec:
  replicas: 3
  # RollingUpdate BAWAAN Kubernetes — INI SENDIRI sudah jadi
  # "Rollback Strategy" tingkat dasar TANPA tooling tambahan apa pun:
  # `kubectl rollout undo deployment/backend-foundation-api`
  # mengembalikan ke ReplicaSet revisi sebelumnya dalam hitungan
  # detik. `maxUnavailable: 0` — SELAMA rolling update, jumlah Pod
  # yang siap melayani TIDAK PERNAH berkurang dari `replicas` (mirip
  # semangat "zero downtime" yang sama dengan `pm2 reload` di
  # `deploy.sh`), `maxSurge: 1` menambah SATU Pod baru dulu sebelum
  # mematikan yang lama, satu-satu bergiliran.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-foundation
      app.kubernetes.io/component: api
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-foundation
        app.kubernetes.io/component: api
        track: stable
    spec:
      # Non-root — SELARAS dengan `USER nodejs` di Dockerfile stage
      # `runner`; dicantumkan ULANG di sini sebagai lapisan pertahanan
      # kedua (Kubernetes akan MENOLAK Pod start kalau image ternyata
      # coba jalan sebagai root, bukan cuma mengandalkan image-nya
      # "baik").
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: backend-foundation:latest # override lewat Helm values.yaml (image.repository/image.tag) — lihat helm/backend-foundation
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/server.js']
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-foundation-config
            - secretRef:
                name: backend-foundation-secret
          # Phase 18 — `/health` (liveness, TIDAK bergantung ke
          # database/Redis, lihat rationale di `health.controller.ts`)
          # vs `/ready` (readiness, false SELAMA graceful shutdown DAN
          # selama dependency belum siap) — SENGAJA dua endpoint
          # BERBEDA untuk dua probe berbeda, BUKAN satu endpoint untuk
          # keduanya (liveness yang salah pakai `/ready` akan membuat
          # Kubernetes me-restart Pod berulang-ulang HANYA karena
          # database sempat lambat sesaat, padahal proses Node-nya
          # sendiri sehat-sehat saja).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Prisma engine & Multer (upload lokal) menulis ke filesystem — lihat LOCAL_STORAGE_DIR di env.ts.
            capabilities:
              drop: ['ALL']
      # WAJIB lebih besar dari `SHUTDOWN_TIMEOUT_MS` (ConfigMap,
      # default 10 detik) — kalau lebih kecil, Kubernetes akan
      # SIGKILL proses SEBELUM `shutdown()` (`server.ts`, Phase 18)
      # sempat selesai men-drain request & menutup koneksi
      # database/Redis dengan bersih. +5 detik buffer di atas
      # `SHUTDOWN_TIMEOUT_MS` untuk margin.
      terminationGracePeriodSeconds: 15
