version: '3.9'

# Compose untuk LOCAL DEVELOPMENT (hot-reload). Untuk deployment
# production, lihat docker-compose.prod.yml — beda target build,
# beda kebijakan networking, tidak ada bind mount source code.

networks:
  backend-network:
    # Nama eksplisit (bukan dibiarkan default project-prefixed seperti
    # `backend-foundation_backend-network`) — supaya
    # `docker-compose.monitoring.yml` (file Compose TERPISAH, lihat
    # Phase 4) bisa bergabung ke jaringan yang SAMA lewat
    # `external: true` tanpa perlu menebak-nebak nama project Compose
    # yang dipakai saat stack utama pertama kali dijalankan.
    name: backend-network
    driver: bridge

services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # `POSTGRES_USER` = superuser bootstrap (mem-bypass RLS, dan TIDAK bisa diturunkan).
      # Aplikasi TIDAK boleh memakainya: role aplikasi dibuat TERPISAH (non-superuser,
      # NOBYPASSRLS) oleh deploy/postgres/01-app-role.sh saat inisialisasi pertama.
      # Volume lama (dibuat sebelum perubahan ini) tidak ikut berubah: `docker compose down -v`.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_dev
      POSTGRES_DB: app_db
      APP_DB_USER: app_user
      APP_DB_PASSWORD: app_password
    # Hanya `127.0.0.1`: sebelumnya `'5432:5432'` memublikasikan database (kredensial dev
    # `app_user`/`app_password`) ke SEMUA interface host. Docker menambahkan aturan iptables
    # sendiri untuk port yang dipublikasikan, yang melewati aturan firewall `INPUT` host
    # (ufw/nftables) — firewall host yang ketat belum tentu melindungi port ini. Port host bisa
    # diganti lewat `POSTGRES_HOST_PORT` di `.env` bila 5432 sudah dipakai (mis. PostgreSQL native).
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # Data persist di named volume — data tidak hilang saat container
      # di-recreate (`docker compose down` tanpa flag -v).
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    networks:
      - backend-network
    healthcheck:
      # `-h 127.0.0.1` (TCP): selama inisialisasi, entrypoint menjalankan server SEMENTARA yang
      # hanya mendengarkan socket unix. Tanpa `-h`, healthcheck bisa lolos sebelum skrip init
      # selesai dan service lain start terlalu dini.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U app_user -d app_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Hanya `127.0.0.1` (Redis dev TANPA password) — lihat catatan di `postgres_db`.
    # Ganti port host lewat `REDIS_HOST_PORT` di `.env` bila 6379 sudah dipakai.
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      # Persist cache antar-restart container — opsional secara
      # semantik (cache boleh hilang kapan saja tanpa merusak
      # aplikasi), tapi tetap nyaman untuk development supaya tidak
      # perlu "memanaskan" cache ulang tiap kali container di-restart.
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend_app:
    build:
      context: .
      dockerfile: Dockerfile
      # Target "deps": stage yang sudah punya SELURUH dependency
      # (termasuk devDependencies: ts-node-dev, prisma CLI, dsb) tanpa
      # menjalankan build production — cocok untuk mode development.
      target: deps
    command: sh -c "npx prisma generate && npm run dev"
    restart: unless-stopped
    # Hanya `127.0.0.1` (compose DEV) — lihat catatan di `postgres_db`. Ganti port host lewat
    # `APP_HOST_PORT` di `.env`. Untuk produksi, `docker-compose.prod.yml` mengatur sendiri.
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      # Override eksplisit agar aplikasi terhubung ke service Postgres
      # lewat NAMA SERVICE (`postgres_db`), diselesaikan otomatis oleh
      # DNS internal Docker Compose di jaringan `backend-network` —
      # bukan `localhost`, dan bukan IP yang bisa berubah-ubah.
      DATABASE_URL: postgresql://app_user:app_password@postgres_db:5432/app_db?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    volumes:
      # Bind mount seluruh project agar perubahan file di host langsung
      # tercermin di container (dipakai oleh ts-node-dev untuk hot-reload).
      - .:/app
      # Anonymous volume: mencegah node_modules hasil bind mount di atas
      # menimpa node_modules yang sudah ter-install di dalam image
      # (terutama krusial untuk native addon seperti bcrypt yang
      # di-compile khusus untuk Linux, beda dengan node_modules di host
      # macOS/Windows).
      - /app/node_modules
    networks:
      - backend-network
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    # Sama seperti `backend_app`, tapi menjalankan proses WORKER
    # (`worker.ts`), BUKAN server HTTP — dua proses ini SENGAJA
    # dipisah, bukan digabung dalam satu container, supaya beban
    # pemrosesan job (kirim email, dst) tidak pernah bersaing
    # resource dengan proses yang melayani HTTP request.
    command: sh -c "npx prisma generate && npm run worker:dev"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres_db:5432/app_db?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - backend-network
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
