# Phase 13 (Enterprise Observability) — Recording rules & alert rules
# untuk SLO/error budget, dan alert kesehatan layanan dasar.
#
# Target SLO (lihat penjelasan lengkap & justifikasi angka di
# docs/slo.md — JANGAN ubah angka di sini tanpa mengubah dokumen itu
# juga, keduanya harus tetap sinkron):
#   - Availability: 99.9% request non-error (4xx/5xx dihitung sebagai
#     error — lihat catatan di docs/slo.md soal kenapa 4xx ikut
#     dihitung meski "kesalahan client") dalam window 30 hari →
#     error budget = 0.1% = 0.001.
#   - Latency: p95 < 300ms.
#
# Strategi alerting error budget memakai "multi-window, multi-burn-rate"
# (pola standar Google SRE workbook) — BUKAN threshold statis tunggal.
# Alasan: alert dari SATU window pendek saja rawan flapping (noise dari
# lonjakan sesaat), sementara alert dari SATU window panjang saja
# terlalu lambat memberi peringatan (baru sadar setelah budget nyaris
# habis). Mengombinasikan window PENDEK (deteksi cepat) DAN window
# PANJANG (konfirmasi ini bukan sekadar noise sesaat) di kondisi `and`
# yang sama menyeimbangkan keduanya.

groups:
  - name: backend-foundation-slo-recording
    rules:
      # Rasio request ERROR (4xx+5xx) terhadap TOTAL request, dihitung
      # ulang di beberapa window — dipisah jadi recording rule (bukan
      # ditulis inline di setiap alert) supaya query yang sama tidak
      # dihitung ulang dua kali (sekali untuk evaluasi alert, sekali
      # lagi kalau dipakai di dashboard Grafana) dan supaya PromQL di
      # alert rule tetap pendek & mudah dibaca.
      - record: slo:http_requests:error_ratio_rate5m
        expr: sum(rate(http_errors_total[5m])) / sum(rate(http_requests_total[5m]))
      - record: slo:http_requests:error_ratio_rate30m
        expr: sum(rate(http_errors_total[30m])) / sum(rate(http_requests_total[30m]))
      - record: slo:http_requests:error_ratio_rate1h
        expr: sum(rate(http_errors_total[1h])) / sum(rate(http_requests_total[1h]))
      - record: slo:http_requests:error_ratio_rate6h
        expr: sum(rate(http_errors_total[6h])) / sum(rate(http_requests_total[6h]))

  - name: backend-foundation-slo-alerts
    rules:
      # Fast burn — rasio error 14.4x lebih tinggi dari error budget di
      # window 5m DAN 1h sekaligus berarti, kalau berlanjut, budget
      # 30 hari akan habis dalam ~2 hari. Window PENDEK (5m) untuk
      # `for:` yang singkat (deteksi cepat), window LEBIH PANJANG (1h)
      # sebagai syarat kedua supaya lonjakan error sesaat (mis. satu
      # deploy yang langsung di-rollback) tidak memicu alert critical
      # yang salah.
      - alert: ErrorBudgetBurnFast
        expr: >
          slo:http_requests:error_ratio_rate5m > (14.4 * 0.001)
          and
          slo:http_requests:error_ratio_rate1h > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'Error budget terbakar cepat — proyeksi habis dalam <2 hari'
          description: >
            Error ratio 5m={{ printf "%.4f" $value }} jauh di atas ambang
            burn-rate 14.4x. Lihat docs/slo.md untuk playbook respons.

      # Slow burn — ambang lebih rendah (6x) tapi window lebih panjang
      # (30m/6h) & `for:` lebih lama — dirancang untuk menangkap
      # degradasi bertahap yang tidak cukup tajam untuk memicu alert
      # fast-burn di atas, tapi tetap akan menghabiskan budget dalam
      # hitungan hari kalau dibiarkan.
      - alert: ErrorBudgetBurnSlow
        expr: >
          slo:http_requests:error_ratio_rate30m > (6 * 0.001)
          and
          slo:http_requests:error_ratio_rate6h > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: 'Error budget terbakar bertahap — proyeksi habis dalam <5 hari'
          description: >
            Error ratio 30m={{ printf "%.4f" $value }} di atas ambang
            burn-rate 6x secara berkelanjutan. Lihat docs/slo.md.

      - alert: LatencyP95AboveSLO
        expr: >
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.3
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: 'p95 latency di atas target SLO (300ms)'
          description: 'p95 latency saat ini {{ printf "%.3f" $value }}s selama >5 menit.'

      - alert: ServiceDown
        expr: up{job="backend_app"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'backend_app tidak bisa di-scrape Prometheus'
          description: 'Target backend_app down selama >1 menit — kemungkinan proses crash atau tidak responsif.'

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'Redis tidak terjangkau'
          description: 'redis_exporter melaporkan Redis down selama >2 menit — Queue/BullMQ dan cache (Phase 6/16) akan terganggu.'

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'PostgreSQL tidak terjangkau'
          description: 'postgres_exporter melaporkan PostgreSQL down selama >2 menit.'

  # -----------------------------------------------------------------
  # Phase 20 (Alerting Finalization) — Database: query latency tinggi.
  # -----------------------------------------------------------------
  - name: backend-foundation-database-alerts
    rules:
      # `pg_stat_activity_max_tx_duration` — metrik BAWAAN default
      # `postgres_exporter` (collector `pg_stat_activity`, AKTIF tanpa
      # konfigurasi queries.yaml tambahan apa pun di image resmi yang
      # dipakai di sini) — detik sejak `xact_start` transaksi PALING
      # LAMA yang masih berjalan (status BUKAN 'idle').
      #
      # CATATAN KEJUJURAN (pola yang sama dengan `docs/disaster-recovery-guide.md`):
      # nama metrik default exporter bisa berbeda antar versi image.
      # SEBELUM mengandalkan alert ini di production, verifikasi metrik
      # ini benar-benar muncul: `curl postgres_exporter:9187/metrics |
      # grep pg_stat_activity_max_tx_duration`. Kalau tidak muncul,
      # exporter perlu `queries.yaml` custom (lihat dokumentasi resmi
      # `prometheuscommunity/postgres_exporter`) — belum termasuk
      # cakupan Phase 20 ini.
      - alert: PostgresQueryLatencyHigh
        expr: pg_stat_activity_max_tx_duration{datname=~".+"} > 5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: 'Ada transaksi PostgreSQL berjalan >5 detik'
          description: >
            Transaksi paling lama di database {{ $labels.datname }} sudah
            berjalan {{ printf "%.1f" $value }} detik selama >5 menit —
            indikasi query lambat/lock yang tertahan, bukan sekadar
            transaksi wajar yang sebentar lagi selesai.

  # -----------------------------------------------------------------
  # Phase 20 (Alerting Finalization) — Queue: job gagal menumpuk &
  # antrian macet. Sumber metrik: `queue_jobs_total`/`queue_worker_up`
  # (Phase 13/19) dan `queue_processing_time` (Phase 20, lihat
  # `src/shared/queue/queue.metrics.ts`).
  # -----------------------------------------------------------------
  - name: backend-foundation-queue-alerts
    rules:
      # `queue_jobs_total` adalah GAUGE (snapshot kedalaman antrian
      # SAAT scrape, lihat komentar di `queue.metrics.ts`), BUKAN
      # counter — jadi "job gagal BERTAMBAH" diukur sebagai "jumlah job
      # berstatus failed MASIH TINGGI secara BERKELANJUTAN" (`for: 10m`),
      # bukan `increase()` (yang secara matematis tidak valid untuk
      # gauge — akan menghasilkan angka yang salah/menyesatkan).
      - alert: QueueFailedJobsHigh
        expr: queue_jobs_total{status="failed"} > 20
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: 'Job gagal menumpuk di queue {{ $labels.queue }}'
          description: >
            {{ printf "%.0f" $value }} job berstatus failed di queue
            {{ $labels.queue }} selama >10 menit — kemungkinan bug di
            processor atau dependency eksternal (email/webhook) yang
            konsisten gagal. Cek `/admin/queues` (Bull Board, Phase 19)
            untuk detail job yang gagal.

      # "Queue stuck" — job MENUNGGU (waiting > 0) TAPI TIDAK ADA yang
      # sedang diproses (active == 0) dalam waktu lama. Beda dari
      # `QueueWorkerDown` di bawah: ini bisa terjadi WALAU worker masih
      # hidup (heartbeat terkirim) tapi macet di satu job (mis. deadlock,
      # infinite loop, external call yang hang tanpa timeout) — worker
      # "terlihat hidup" tapi tidak benar-benar memproses apa pun.
      - alert: QueueStuck
        expr: queue_jobs_total{status="waiting"} > 0 and queue_jobs_total{status="active"} == 0
        for: 10m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'Queue {{ $labels.queue }} tampak macet — ada job menunggu tapi tidak ada yang diproses'
          description: >
            Job menantri di queue {{ $labels.queue }} selama >10 menit
            tanpa ada job aktif yang diproses. Cek `queue_worker_up`
            untuk memastikan worker benar-benar hidup, lalu periksa log
            worker untuk job yang mungkin macet/hang.

      # Sinyal "stuck" YANG LEBIH LANGSUNG — heartbeat worker
      # (`sendWorkerHeartbeat`, `src/worker.ts`) berhenti terkirim sama
      # sekali, bukan cuma diinferensikan dari kedalaman antrian.
      - alert: QueueWorkerDown
        expr: queue_worker_up == 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: 'Worker queue {{ $labels.queue }} tidak terdeteksi hidup'
          description: >
            Tidak ada heartbeat dari worker {{ $labels.queue }} selama
            >5 menit — proses worker kemungkinan crash atau tidak
            pernah dijalankan (lihat `src/worker.ts`).

  # -----------------------------------------------------------------
  # Phase 20 (Alerting Finalization) — Infrastructure: CPU/Memory/Disk.
  # Sumber metrik: `node_exporter` (lihat `docker-compose.monitoring.yml`
  # & scrape job `node` di `prometheus.yml` — SEBELUM Phase 20 tidak
  # ada exporter host sama sekali).
  # -----------------------------------------------------------------
  - name: backend-foundation-infrastructure-alerts
    rules:
      # `100 - avg(rate(idle[5m])) * 100` — pola PromQL standar untuk
      # "% CPU busy" dari counter `node_cpu_seconds_total` (waktu
      # KUMULATIF per mode CPU) — `rate()` dulu (baru berubah jadi
      # laju detik-per-detik yang valid dibandingkan), BUKAN
      # `increase()` langsung dari counter mentah.
      - alert: HostCpuUsageHigh
        expr: >
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: 'CPU host {{ $labels.instance }} di atas 85%'
          description: 'Rata-rata CPU busy {{ printf "%.1f" $value }}% selama >10 menit.'

      - alert: HostMemoryUsageHigh
        expr: >
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: 'Memory host {{ $labels.instance }} di atas 90%'
          description: 'Memory terpakai {{ printf "%.1f" $value }}% selama >10 menit (dihitung dari MemAvailable, BUKAN sekadar MemFree — memperhitungkan cache/buffer yang bisa direklaim OS).'

      - alert: HostDiskSpaceLow
        expr: >
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} di host {{ $labels.instance }} di atas 85% terpakai'
          description: 'Filesystem {{ $labels.mountpoint }} terpakai {{ printf "%.1f" $value }}% selama >15 menit — backup (lihat docs/backup-restore-guide.md) & log rotation perlu dicek.'
