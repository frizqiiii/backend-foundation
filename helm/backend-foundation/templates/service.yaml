apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "backend-foundation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend-foundation
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: http
