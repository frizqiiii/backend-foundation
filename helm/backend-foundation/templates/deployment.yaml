apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "backend-foundation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    track: stable
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-foundation
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-foundation
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        track: stable
      annotations:
        # Checksum config/secret — mengubah value di ConfigMap/Secret
        # (via `values.yaml` baru) otomatis memicu Pod restart, TANPA
        # ini Kubernetes TIDAK tahu ConfigMap yang di-mount lewat
        # `envFrom` berubah (beda dari volume mount yang auto-reload).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['node', 'dist/server.js']
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.secrets }}
            - secretRef:
                name: {{ .Release.Name }}-secret
            {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
