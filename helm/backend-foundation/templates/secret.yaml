{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "backend-foundation.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- else }}
# `values.secrets` kosong — Secret TIDAK dibuat chart ini sama
# sekali (lihat komentar `values.yaml`: production sungguhan
# sebaiknya pakai External Secrets Operator, bukan `--set` value
# sensitif langsung ke Helm). `helm install` akan GAGAL saat
# deployment.yaml mencoba `secretRef` ke Secret yang tidak ada —
# kegagalan itu SENGAJA dibiarkan jelas di awal (fail-fast) daripada
# Pod silently CrashLoopBackOff karena env var kredensial kosong.
{{- end }}
