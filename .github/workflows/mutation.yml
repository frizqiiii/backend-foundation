name: Mutation Testing (mingguan)

# Fase 3 (item 3.5) — `npx stryker run` PENUH sebagai job terjadwal
# TERPISAH dari CI utama (`ci.yml`).
#
# NON-BLOCKING secara desain: workflow ini hanya berjalan terjadwal
# (dan manual lewat "Run workflow"), TIDAK dipicu oleh push/pull
# request, jadi tidak pernah menahan merge atau memperlambat PR.
# Run penuh memakan ~125 menit di mesin lokal — terlalu lama untuk
# jalur PR. Kalau skor turun di bawah `thresholds.break` di
# `stryker.conf.json` (sekarang 50), run ini gagal (merah) dan itu
# sinyalnya; selain itu hasilnya untuk dipantau tren dan survivors-nya.
#
# Tidak butuh service container: seluruh suite jest yang dijalankan
# Stryker memakai mock Prisma/Redis (`jest.setup.ts` menimpa
# DATABASE_URL ke dummy), terbukti jalan tanpa Postgres/Redis.

on:
  schedule:
    # Minggu 18:00 UTC = Senin 01:00 WIB — di luar jam kerja.
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Jangan menumpuk dua run penuh sekaligus (satu run bisa berjam-jam).
concurrency:
  group: mutation-testing
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  mutation:
    name: Stryker (full)
    runs-on: ubuntu-latest
    # Run manual pertama di GitHub selesai dalam 30m34s; batas ini ~3x
    # durasi itu (margin untuk hari runner lambat). Naikkan kalau run
    # mingguan mulai mendekatinya.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Info runner (CPU, memori, disk, OS)
        # Diagnostik: run penuh gagal dua kali berturut-turut di menit ke-8 sampai 12 dengan child process Stryker
        # `SIGKILL` ("The operation was canceled."), padahal kode dan lockfile identik dengan run yang sukses.
        # Angka ini membantu memastikan apakah itu tekanan memori/CPU atau perbedaan image runner.
        run: |
          nproc
          free -m
          df -h / | tail -2
          head -2 /etc/os-release
      - name: Stryker (full run)
        # Diagnostik: pencatat berkala menulis memori/CPU/proses terbesar ke LOG langkah ini tiap 10 detik. Saat langkah ini
        # dibatalkan, langkah sesudahnya (termasuk yang ber-`if: always()`) ikut terlewat, jadi satu-satunya data yang
        # pasti selamat adalah yang sudah tertulis di log ini. Tidak mengubah perintah Stryker maupun kode keluarnya.
        run: |
          uname -r
          (
            while true; do
              oom=$(sudo dmesg 2>/dev/null | grep -c -i -E "out of memory|oom-kill|killed process" || true)
              echo "[heartbeat $(date -u +%H:%M:%S)] $(free -m | awk 'NR==2{printf "mem_used=%sMB avail=%sMB", $3, $7}') load=$(cut -d' ' -f1-3 /proc/loadavg) oom_events=$oom top=$(ps -eo comm=,rss= --sort=-rss | head -3 | awk '{printf "%s:%dMB ", $1, $2/1024}')"
              sleep 10
            done
          ) &
          HEARTBEAT=$!
          trap 'pkill -P "$HEARTBEAT" 2>/dev/null || true; kill "$HEARTBEAT" 2>/dev/null || true' EXIT
          npx stryker run
      - name: Diagnosa OOM (hanya saat gagal)
        if: failure()
        run: |
          free -m
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill|killed process" | tail -20 || true
      - name: Ringkasan hasil
        # Tetap dijalankan walau Stryker gagal (mis. skor di bawah batas)
        # supaya angka & survivors tetap terlihat di halaman run.
        if: always()
        run: node scripts/mutation-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
