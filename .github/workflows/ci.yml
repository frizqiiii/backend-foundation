name: CI

# Sesuai dokumentasi di docs/security-guide.md & docs/runbook.md:
# lint+format, typecheck+build, test (unit/coverage + e2e + contract
# dengan service container Postgres+Redis), npm audit, Docker build +
# Trivy scan, GitHub Dependency Review.
#
# Kredensial DATABASE_URL di bawah SENGAJA disamakan persis dengan
# yang di-hardcode jest.setup.ts (test:test@localhost:5432/test_db)
# supaya npm run test:contract tidak gagal connect diam-diam.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint (max-warnings 0)
        run: npm run lint:ci
      - name: Prettier check
        run: npm run format:check

  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  test:
    name: Test (unit + coverage + e2e + contract)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Unit + integration + e2e tests with coverage
        run: npm run test:coverage
      - name: Contract tests (Pact)
        run: npm run test:contract
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (informational — lihat scripts/check-npm-audit.js untuk alasan gate sebenarnya bukan ini)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Advisory allowlist triage (gate sebenarnya)
        run: npm run audit:check
      - name: GitHub Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  docker-build-and-scan:
    name: Docker Build + SBOM + Sign + Trivy Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck-and-build, test]
    # `packages: write` — push image ke GHCR (dibutuhkan SEBELUM bisa
    # di-sign; cosign menandatangani referensi image di registry, beda
    # dari `cosign sign-blob` yang menandatangani file lepas).
    # `id-token: write` — token OIDC dari GitHub Actions sendiri,
    # dipakai cosign untuk KEYLESS signing (Sigstore Fulcio/Rekor) —
    # TIDAK ADA private key yang perlu disimpan sebagai secret sama
    # sekali, identitas penandatangan = identitas workflow ini sendiri
    # (bisa diverifikasi siapa pun lewat transparency log publik Rekor).
    permissions:
      contents: read
      packages: write
      id-token: write
    #
    # Temuan T9 — DUA MODE, dibedakan oleh `github.event_name`:
    #  - `push` (ke main): alur LAMA persis — push ke GHCR, scan, SBOM,
    #    sign, attest.
    #  - `pull_request`: image HANYA di-build lokal di runner (`load`),
    #    di-scan dan di-SBOM dari image lokal itu, TIDAK di-push dan TIDAK
    #    di-sign. Sebelum ini, tiap run PR ikut mem-push image ke GHCR dan
    #    menandatanganinya (keyless) — registry terisi image dari kode yang
    #    belum di-review, tanda tangan tidak berarti "sudah di-review", dan
    #    PR dari fork gagal karena tidak punya `packages: write`.
    # `packages: write`/`id-token: write` tetap di level job (GitHub tidak
    # mendukung izin kondisional); langkah yang memakainya di-`if` ke push.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in ke GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build image (PR: lokal saja) / Build & push image (push ke main)"
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Referensi image untuk scan & SBOM. Push: dari registry, by digest
      # (persis seperti sebelumnya). PR: image lokal di daemon runner.
      - name: Tentukan referensi image
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            if [ -z "$DIGEST" ]; then
              echo "::error::Digest image kosong pada event push — build/push gagal diam-diam?"
              exit 1
            fi
            echo "trivy=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "syft=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "trivy=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
            echo "syft=docker:${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Trivy scan (gate - multer v2 + npm/corepack removal applied, IMPLEMENTED not yet VERIFIED on real Actions run, revert exit-code to 0 if other findings remain)"
        # Temuan T10 — di-pin ke SHA commit PENUH, bukan tag/branch. Pada
        # 2026-03-19 tag `aquasecurity/trivy-action` (76 dari 77) di-force-push
        # ke malware pencuri kredensial (GHSA-69fq-xp46-6x23 / CVE-2026-33634);
        # tag dan `@master` adalah pointer yang BISA BERUBAH, SHA tidak.
        # Commit ini = tag v0.36.0 (dirilis pasca-insiden): `setup-trivy` dan
        # `actions/cache` di dalamnya sudah di-pin SHA, dan versi Trivy bawaannya
        # v0.70.0 (rilis berbahaya v0.69.4-0.69.6 sudah dicabut). Cara memperbarui:
        # `git ls-remote --tags https://github.com/aquasecurity/trivy-action`, ambil
        # SHA commit (baris `^{}` kalau tag beranotasi), periksa `action.yaml`-nya,
        # LALU jalankan CI — versi Trivy berbeda bisa menemukan hal yang berbeda.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.trivy }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # SBOM (item 2.5) — syft membaca LANGSUNG dari image yang baru
      # di-push (bukan dari source code di runner) supaya SBOM
      # mencerminkan PERSIS apa yang benar-benar ada di dalam image
      # (termasuk dependency sistem Alpine, bukan cuma npm package).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM (CycloneDX)
        run: |
          syft "${{ steps.ref.outputs.syft }}" \
            -o cyclonedx-json=sbom.cyclonedx.json \
            -o table

      - name: Upload SBOM sebagai artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

      # Image signing + SBOM attestation (item 2.5) — KEYLESS, lihat
      # komentar `permissions.id-token` di atas untuk alasan lengkap.
      # Hanya event `push` (lihat komentar T9 di atas): PR tidak di-sign.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: github.event_name == 'push'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM ke image (keyless)
        if: github.event_name == 'push'
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cyclonedx.json \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"